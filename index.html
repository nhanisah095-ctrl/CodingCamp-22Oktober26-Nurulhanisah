<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ══════════════════════════════════════════
       HEADER
  ═══════════════════════════════════════════════ -->
  <header class="header">
    <div class="header__inner container">

      <div class="header__brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">Life Dashboard</span>
      </div>

      <div class="header__greeting">
        <p id="greeting-text" class="greeting-text">Good morning,</p>
        <h1 id="greeting-name" class="greeting-name">Welcome 👋</h1>
        <p id="current-date" class="current-date"></p>
      </div>

      <div class="header-controls">
        <div id="live-clock" class="live-clock" aria-live="polite" aria-atomic="true"></div>
        <button id="theme-toggle" class="btn btn--icon" aria-label="Toggle dark mode" title="Toggle Light / Dark Mode">
          <span id="theme-icon" class="theme-icon-inner">🌙</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ══════════════════════════════════════════
       MAIN
  ═══════════════════════════════════════════════ -->
  <main class="main container">

    <!-- Row 1: Timer + Quick Links -->
    <div class="grid grid--2col">

      <!-- ── Focus Timer ── -->
      <section class="card card--timer" aria-labelledby="timer-heading">
        <div class="card__header">
          <h2 id="timer-heading" class="card__title">Focus Timer</h2>
          <span class="card__badge">Pomodoro</span>
        </div>

        <!-- Circular SVG ring -->
        <div class="timer-ring-wrapper">
          <svg class="timer-ring" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="timer-ring__track" cx="100" cy="100" r="84"/>
            <circle class="timer-ring__progress" id="timer-ring-progress" cx="100" cy="100" r="84"/>
          </svg>
          <div class="timer-ring__inner">
            <div class="timer-display" id="timer-display" aria-live="polite" aria-label="Countdown timer">25:00</div>
            <div class="timer-status" id="timer-status">Ready</div>
          </div>
        </div>

        <div class="timer-controls">
          <button id="timer-start" class="btn btn--primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            Start
          </button>
          <button id="timer-stop" class="btn btn--secondary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="4" height="12"/><rect x="14" y="6" width="4" height="12"/></svg>
            Stop
          </button>
          <button id="timer-reset" class="btn btn--ghost">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
            Reset
          </button>
        </div>
        <p class="timer-note">25-minute deep work session</p>

      </section>

      <!-- ── Quick Links ── -->
      <section class="card" aria-labelledby="links-heading">
        <div class="card__header">
          <h2 id="links-heading" class="card__title">Quick Links</h2>
          <span class="card__badge" id="links-count-badge">0 saved</span>
        </div>

        <form id="link-form" class="link-form" novalidate>
          <input
            id="link-label"
            class="input"
            type="text"
            placeholder="Label (e.g. GitHub)"
            maxlength="40"
            autocomplete="off"
            aria-label="Link label"
          />
          <input
            id="link-url"
            class="input"
            type="url"
            placeholder="https://..."
            autocomplete="off"
            aria-label="Link URL"
          />
          <button type="submit" class="btn btn--primary btn--full">Add Link</button>
        </form>
        <p id="link-error" class="form-error" role="alert" aria-live="polite"></p>

        <ul id="links-list" class="links-list" aria-label="Saved quick links"></ul>
      </section>

    </div>

    <!-- Row 2: To-Do List -->
    <section class="card card--todo" aria-labelledby="todo-heading">
      <div class="card__header">
        <h2 id="todo-heading" class="card__title">Tasks</h2>
        <div class="todo-header-right">
          <div class="todo-progress-wrap">
            <div class="todo-progress-bar">
              <div class="todo-progress-fill" id="todo-progress-fill"></div>
            </div>
            <span id="todo-progress-label" class="todo-progress-label">0%</span>
          </div>
        </div>
      </div>

      <form id="todo-form" class="todo-add-form" novalidate>
        <input
          id="todo-input"
          class="input input--lg"
          type="text"
          placeholder="Add a new task…"
          maxlength="120"
          autocomplete="off"
          aria-label="New task"
        />
        <button type="submit" class="btn btn--primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add
        </button>
      </form>
      <p id="todo-error" class="form-error" role="alert" aria-live="polite"></p>

      <div class="todo-toolbar">
        <div class="todo-filters" role="group" aria-label="Filter tasks">
          <button class="filter-btn filter-btn--active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Done</button>
        </div>
        <button id="clear-completed" class="btn btn--ghost btn--sm">Clear done</button>
      </div>

      <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>

      <div class="todo-footer">
        <span id="todo-count" class="todo-count"></span>
      </div>
    </section>

    <!-- Row 3: Settings -->
    <section class="card card--settings" aria-labelledby="settings-heading">
      <div class="card__header">
        <h2 id="settings-heading" class="card__title">Settings</h2>
      </div>
      <div class="settings-body">
        <div class="settings-field">
          <label class="settings-label" for="name-input">Display Name</label>
          <form id="name-form" class="settings-form" novalidate>
            <input
              id="name-input"
              class="input"
              type="text"
              placeholder="Enter your name…"
              maxlength="40"
              autocomplete="off"
              aria-label="Your name"
            />
            <button type="submit" class="btn btn--primary">Save</button>
          </form>
          <p class="settings-hint">Shown in the greeting header.</p>
        </div>
      </div>
    </section>

  </main>

  <!-- Edit Task Modal -->
  <div id="edit-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__box">
      <div class="modal__header">
        <h3 id="modal-title" class="modal__title">Edit Task</h3>
        <button class="modal__close" id="edit-cancel-x" aria-label="Close modal">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <input
        id="edit-input"
        class="input input--lg"
        type="text"
        maxlength="120"
        aria-label="Edit task text"
      />
      <p id="edit-error" class="form-error" role="alert" aria-live="polite"></p>
      <div class="modal__actions">
        <button id="edit-cancel" class="btn btn--ghost">Cancel</button>
        <button id="edit-save"   class="btn btn--primary">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
